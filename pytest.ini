[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = -v -s --alluredir=allure-results
#addopts = -v -s --alluredir=allure-results --reruns 2 --reruns-delay 3 --ignore=_

markers =
    smoke: Critical tests to verify the basic application functionality
    regression: Tests to verify existing functionality after changes